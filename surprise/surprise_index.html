<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Love</title>
  <link rel="stylesheet" href="surprise_style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>
  <div class="hearts" id="hearts"></div>

  <main class="hero">
    <section class="card">
      <p class="line">A little surprise</p>
      <h1>For <span class="name">Mrudula</span></h1>
      <p class="subtitle">
        Before anything else, I just wanted to make something soft, warm, and beautiful — the way you make my world feel.
      </p>

      <div class="typewriter-wrap">
        <span class="typewriter" id="typewriter"></span>
      </div>

      <div class="actions">
        <button class="primary" id="beginBtn">Begin the story</button>
        <button class="ghost" id="noteBtn">Open a small note</button>
      </div>

      <p class="hidden-message" id="noteMessage">
        You are my favorite part of every day.
      </p>
    </section>
  </main>

  <script src="surprise_script.js"></script>
</body>
</html>
